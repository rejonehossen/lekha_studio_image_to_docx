<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ PRODUCT_NAME }}{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'studio/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'studio/css/components.css' %}">
  <link rel="stylesheet" href="{% static 'studio/css/responsive.css' %}">
  <link rel="stylesheet" href="{% static 'studio/css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'studio/css/book_designer.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'studio:dashboard' %}">{{ PRODUCT_NAME }}</a>
    <nav>
      <a href="{% url 'studio:dashboard' %}">Dashboard</a>
      <a href="{% url 'studio:settings' %}">Settings</a>
    </nav>
  </header>
  <main class="container">
    {% if messages %}
      <ul class="messages">
        {% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'studio/js/app.js' %}"></script>
  <script src="{% static 'studio/js/accessibility.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
